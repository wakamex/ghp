name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Test
        run: >-
          uv --no-config run --python "${{ matrix.python-version }}" --locked
          python -m unittest discover -s tests

  install:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Build and test installation
        run: scripts/test-install.sh
