[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghp"
version = "0.2.0"
description = "Compact GitHub activity summary with repository-scoped checkpoints"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.urls]
Homepage = "https://github.com/wakamex/ghp"
Source = "https://github.com/wakamex/ghp"

[project.scripts]
ghp = "ghp.cli:main"

[tool.hatch.build.targets.sdist]
exclude = [
  "/benchmarks",
]
